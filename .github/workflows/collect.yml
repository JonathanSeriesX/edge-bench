name: collect

on:
  schedule:
    # Every 6 hours. One round is well inside the 250 tests/hour free cap.
    - cron: '11 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  # Runs a measurement round and force-pushes the accumulated results to the
  # `data` branch. Nothing is committed to main, so scheduled rounds never
  # trigger platform rebuilds — the dashboard fetches the summary from the
  # data branch at runtime.
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore accumulated data
        run: |
          git fetch origin data || true
          git checkout origin/data -- data public/data 2>/dev/null || echo "no data branch yet — starting fresh"

      - name: Run a measurement round
        env:
          GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_TOKEN }}
        run: node collector/collect.mjs

      - name: Aggregate
        run: node collector/aggregate.mjs

      - name: Push results to the data branch
        # The branch is a single rolling commit on top of main; the NDJSON
        # files inside it are cumulative, so the full history lives in the
        # data itself rather than in git commits.
        run: |
          git config user.name  "edge-bench"
          git config user.email "edge-bench@users.noreply.github.com"
          git add -f data public/data
          git commit -m "data: round $(date -u +%FT%TZ)"
          git push --force origin HEAD:refs/heads/data

  # Rebuilds the GitHub Pages dashboard. Only needed when code changes — data
  # is fetched at runtime, so scheduled rounds don't require a redeploy.
  publish:
    if: github.event_name != 'schedule'
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build static export
        # GitHub Pages cannot run the /bench/now function, and force-dynamic
        # routes cannot be statically exported — drop the route for this build.
        run: |
          rm -rf app/bench
          STATIC_EXPORT=1 BASE_PATH=/edge-bench pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
