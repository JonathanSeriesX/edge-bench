name: collect

on:
  schedule:
    # Every 6 hours. One round is well inside the 250 tests/hour free cap.
    - cron: '11 */6 * * *'
  push:
    branches: [main]
    # Run a fresh round whenever code or config changes. The data commits this
    # workflow makes itself only touch these paths, so they don't re-trigger it.
    paths-ignore:
      - 'data/**'
      - 'site/data/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run a measurement round
        env:
          GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_TOKEN }}
        run: node collector/collect.mjs

      - name: Aggregate
        run: node collector/aggregate.mjs

      - name: Commit results
        run: |
          git config user.name  "edge-bench"
          git config user.email "edge-bench@users.noreply.github.com"
          git add data site/data
          git diff --quiet --cached || git commit -m "data: round $(date -u +%FT%TZ)"
          git pull --rebase --autostash
          git push

  publish:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The collect job just pushed a data commit; deploy that, not the
          # commit that triggered the workflow.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build static export
        # GitHub Pages cannot run the /bench/now function, and force-dynamic
        # routes cannot be statically exported — drop the route for this build.
        run: |
          rm -rf app/bench
          STATIC_EXPORT=1 BASE_PATH=/edge-bench pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
