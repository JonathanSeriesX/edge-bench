name: collect

on:
  schedule:
    # Every 6 hours. One round is well inside the 250 tests/hour free cap.
    - cron: '11 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  # Runs a measurement round and commits the results to the separate
  # edge-bench-data repo. This repo never receives data pushes, so rounds
  # cannot trigger platform builds or preview deployments — the dashboard
  # fetches summary.json from the data repo at runtime.
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out the data repo
        env:
          KEY: ${{ secrets.DATA_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 git@github.com:JonathanSeriesX/edge-bench-data.git /tmp/edge-bench-data
          mkdir -p data public/data
          cp /tmp/edge-bench-data/raw/*.ndjson data/ 2>/dev/null || true

      - name: Run a measurement round
        env:
          GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_TOKEN }}
        run: node collector/collect.mjs

      - name: Aggregate
        run: node collector/aggregate.mjs

      - name: Commit results to the data repo
        run: |
          cp data/*.ndjson /tmp/edge-bench-data/raw/
          cp public/data/summary.json /tmp/edge-bench-data/summary.json
          cd /tmp/edge-bench-data
          git config user.name  "edge-bench"
          git config user.email "edge-bench@users.noreply.github.com"
          git add -A
          git diff --quiet --cached || git commit -m "round $(date -u +%FT%TZ)"
          git push

  # Rebuilds the GitHub Pages dashboard. Only needed when code changes — data
  # is fetched at runtime, so scheduled rounds don't require a redeploy.
  publish:
    if: github.event_name != 'schedule'
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build static export
        # GitHub Pages cannot run the /bench/now function, and force-dynamic
        # routes cannot be statically exported — drop the route for this build.
        run: |
          rm -rf app/bench
          STATIC_EXPORT=1 BASE_PATH=/edge-bench pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
